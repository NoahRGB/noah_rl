  obs_type: "screen_pixels" # game_state
  max_steps: 300 
  num_scanners: 0 
  game_level: 1 
  aggro: 0
  exploring_starts: True 
  reverse_gravity: False 
  display_scale: 1
  action_space: "discrete"

num_envs: 1
wrappers:
