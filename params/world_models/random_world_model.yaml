env_name: "ThrustEnv"
env_kwargs:
  render_mode:

  obs_type: "screen_pixels" # game_state
  max_steps: 300 
  num_scanners: 0 
  game_level: 1 
  aggro: 0
  exploring_starts: True 
  reverse_gravity: False 
  display_scale: 1
  action_space: "discrete"

num_envs: 1
wrappers:
  greyscale:
    keep_dim: False
  resize:
    shape: [84,84]
  frame_stack:
    stack_size: 4

save_network: True 
save_interval: 1000 # timesteps between checkpoints
load_path:
seed: 1
device: "cuda" # cpu or cuda
timesteps: 10_000_000 
lr: 0.001
replay_size: 50_000
state_scale: 255.0
minibatch_size: 64
world_model_update_interval: 1
latent_dim: 50

network_architecture: