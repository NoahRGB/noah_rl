title: "tests"

hydra:
  run:
    dir: "results/logs/${title}_${now:%H%M%S}"

env_name: "CartPole-v1"
env_kwargs:
  render_mode: 
  # obs_type: "game_state"
  # max_steps: 250
  # num_scanners: 20 
  # game_level: -1 
  # aggro: 0
  # exploring_starts: True 

num_envs: 32 
wrappers:
