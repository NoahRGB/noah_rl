save_network: False 
seed: 1
timesteps: 10_000_000
rollout_len: 128 
epochs: 5 
minibatch_size: 128 
lr: 0.0003
gamma: 0.99
lam: 0.95
epsilon: 0.2
entropy_weight: 0.04
value_weight: 0.5
cgn: 0.5
load_path: # "results/temp/network.pt"

network_architecture:

  icm_enc:
    - type: "LINEAR"
      in: "IN"
      out: 256 
      activation: "RELU"
    - type: "LINEAR"
      in: 256 
      out: 256 
      activation: "RELU"

  icm_inv_enc:
    - type: "LINEAR"
      in: "IN"
      out: 256 
      activation: "RELU"

  icm_forward_enc:
    - type: "LINEAR"
      in: "IN"
      out: 256 
      activation: "RELU"

















