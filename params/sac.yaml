title: "sactests"

hydra:
  run:
    dir: "results/logs/${title}_${now:%H%M%S}"

env_name: "MountainCarContinuous-v0"
env_kwargs:
  render_mode:

num_envs: 1
wrappers:


save_network: True 
seed: 1
timesteps: 10_000_000
lr: 0.001
replay_size: 100_000
minibatch_size: 64 
update_freq: 256 
gradient_steps: 128
warmup_steps: 1000
gamma: 0.99
alpha_start: 0.1
auto_alpha: True
tau: 0.005
cgn: 0.5
load_path:

network_architecture:
  qnet_enc:
    - type: "LINEAR"
      in: "IN"
      out: 256
      activation: "RELU"
    - type: "LINEAR"
      in: 256
      out: 256
      activation: "RELU"

  actor_enc:
    - type: "LINEAR"
      in: "IN"
      out: 256
      activation: "RELU"
    - type: "LINEAR"
      in: 256
      out: 256
      activation: "RELU"
  
