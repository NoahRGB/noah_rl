title: "sactests"

hydra:
  run:
    dir: "results/logs/${title}_${now:%H%M%S}"

env_name: "ThrustEnv"
env_kwargs:
  render_mode:
  obs_type: "game_state"
  max_steps: 400 
  num_scanners: 20 
  game_level: -1 
  aggro: 0
  exploring_starts: True 
  reverse_gravity: True 
  display_scale: 1
  action_space: "continuous"

num_envs: 1
wrappers:


save_network: True 
seed: 1
timesteps: 10_000_000
lr: 0.001
replay_size: 100_000
minibatch_size: 64 
update_freq: 256 
gradient_steps: 128
warmup_steps: 1000
gamma: 0.99
alpha_start: 0.1
auto_alpha: True
tau: 0.005
cgn: 0.5
load_path:

network_architecture:
  qnet_enc:
    - type: "LINEAR"
      in: "IN"
      out: 256
      activation: "RELU"
    - type: "LINEAR"
      in: 256
      out: 256
      activation: "RELU"

  actor_enc:
    - type: "LINEAR"
      in: "IN"
      out: 256
      activation: "RELU"
    - type: "LINEAR"
      in: 256
      out: 256
      activation: "RELU"
  
